# Test / production: one container serves the SPA and /api.
# App config is /app/config.yaml inside the image (root: /data).
# WEB_GREP_* environment variables are optional one-shot overrides.
#
#   WEB_GREP_DATA=/var/log WEB_GREP_TOKEN=secret docker compose up --build -d
#
# Pre-built GHCR images (no local build): compose.ghcr.yaml / docs/docker.md
#   docker compose -f compose.ghcr.yaml up -d
# GHCR :dev / v* / :latest are multi-arch linux/amd64+linux/arm64.
#
# Or mount your own yaml (must use root: /data):
#   - ./config.deploy.yaml:/app/config.yaml
# Persist search-count next to that file if you care about the badge.

name: web-grep

services:
  web-grep:
    build:
      context: .
      dockerfile: Dockerfile
    image: web-grep:local
    user: "${WEB_GREP_UID:-0}:${WEB_GREP_GID:-0}"
    ports:
      - "${WEB_GREP_PORT:-8787}:8787"
    environment:
      WEB_GREP_TOKEN: ${WEB_GREP_TOKEN:?set WEB_GREP_TOKEN (or mount a config.yaml with token)}
      WEB_GREP_PUBLIC_HOST: ${WEB_GREP_PUBLIC_HOST:-}
      WEB_GREP_PUBLIC_PATH: ${WEB_GREP_PUBLIC_PATH:-}
    volumes:
      - type: bind
        source: ${WEB_GREP_DATA:?set WEB_GREP_DATA to the host directory to search}
        target: /data
        read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:8787/api/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
