# Pull a published GHCR image (no local build). Same mounts / env as docker-compose.yml.
# Default tag is :dev (rebuilt and overwritten on every main merge).
# Pin a release: WEB_GREP_IMAGE=ghcr.io/fun7257/web-grep:v0.2.0
#
#   WEB_GREP_DATA=/var/log WEB_GREP_TOKEN=secret docker compose -f compose.ghcr.yaml up -d

name: web-grep

services:
  web-grep:
    image: ${WEB_GREP_IMAGE:-ghcr.io/fun7257/web-grep:dev}
    pull_policy: always
    user: "${WEB_GREP_UID:-0}:${WEB_GREP_GID:-0}"
    ports:
      - "${WEB_GREP_PORT:-8787}:8787"
    environment:
      WEB_GREP_TOKEN: ${WEB_GREP_TOKEN:?set WEB_GREP_TOKEN (or mount a config.yaml with token)}
      WEB_GREP_PUBLIC_HOST: ${WEB_GREP_PUBLIC_HOST:-}
      WEB_GREP_PUBLIC_PATH: ${WEB_GREP_PUBLIC_PATH:-}
    volumes:
      - type: bind
        source: ${WEB_GREP_DATA:?set WEB_GREP_DATA to the host directory to search}
        target: /data
        read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:8787/api/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
